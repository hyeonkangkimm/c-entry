spring:
  config:
    import: ""

  datasource:
    url: jdbc:h2:mem:gonggong-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.H2Dialect

  ai:
    openai:
      api-key: test
    vectorstore:
      pgvector:
        initialize-schema: false

hsk:
  dataset:
    initialize: false
  embedding:
    initialize: false

tariff:
  dataset:
    initialize: false
