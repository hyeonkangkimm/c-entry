services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: gonggong-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: gonggong
      POSTGRES_USER: gonggong
      POSTGRES_PASSWORD: gonggong
      TZ: Asia/Seoul
    volumes:
      - gonggong-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gonggong -d gonggong"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  gonggong-postgres-data:
